[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hurricane-intensity"
version = "0.1.0"
description = "Data pipeline: GOES-16 ABI imagery matched to HURDAT2 best-track fixes"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
